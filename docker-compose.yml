services:
  spec-forge-mcp:
    image: ghcr.io/faisalkcmvp/spec-forge-mcp:latest
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      AI_API_KEY: ${AI_API_KEY}
      AI_BASE_URL: ${AI_BASE_URL}
      DEFAULT_TABLE_OUTPUT_PATH: /app/output/document-tables.json
    volumes:
      - ./output:/app/output
    restart: unless-stopped
